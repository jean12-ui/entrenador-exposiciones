<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Simulador de Exposiciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-5xl mx-auto flex flex-col gap-6">
        
        <!-- Encabezado -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400 flex items-center gap-2">
                    <span>👑</span> Panel de Control de Licencias
                </h1>
                <p class="text-xs text-slate-400 mt-1">Genera y administra los accesos para tus 10+ clientes</p>
            </div>
            <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 text-xs px-3 py-1.5 rounded-full font-mono">
                Admin Mode Active
            </span>
        </header>

        <!-- Métricas Rápidas -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <span class="text-xs font-semibold text-slate-400 uppercase">Total Vendidos</span>
                <div class="text-2xl font-bold text-slate-100 mt-1" id="statTotal">0</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <span class="text-xs font-semibold text-slate-400 uppercase">Licencias Activas</span>
                <div class="text-2xl font-bold text-emerald-400 mt-1" id="statActive">0</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <span class="text-xs font-semibold text-slate-400 uppercase">Licencias Vencidas</span>
                <div class="text-2xl font-bold text-rose-400 mt-1" id="statExpired">0</div>
            </div>
        </section>

        <!-- Formularios y Generador -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-4">
            <h2 class="text-sm font-semibold text-slate-200">Generar Nueva Licencia para Cliente</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nombre o Nota del Cliente</label>
                    <input type="text" id="clientName" placeholder="Ej: Juan Pérez / Universidad X" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Duración del Acceso</label>
                    <select id="durationDays" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="7">7 Días (1 Semana)</option>
                        <option value="15">15 Días</option>
                        <option value="30" selected>30 Días (1 Mes)</option>
                        <option value="90">90 Días (3 Meses)</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg text-xs transition">
                        ⚡ Generar PIN Aleatorio
                    </button>
                </div>
            </div>
        </section>

        <!-- Tabla de Licencias Emitidas -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold text-slate-200">Registro de Licencias Emitidas</h2>
                <button id="btnClearAll" class="text-xs text-rose-400 hover:underline">Borrar Historial de Ventas</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                        <tr>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">PIN Generado</th>
                            <th class="p-3">Duración</th>
                            <th class="p-3">Vencimiento</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="licensesTableBody" class="divide-y divide-slate-800/60 font-mono">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        const SECRET_SALT = "PALTA_SECRET_2026";
        let licenses = JSON.parse(localStorage.getItem('admin_sales_records')) || [];

        const clientName = document.getElementById('clientName');
        const durationDays = document.getElementById('durationDays');
        const btnGenerate = document.getElementById('btnGenerate');
        const licensesTableBody = document.getElementById('licensesTableBody');
        const btnClearAll = document.getElementById('btnClearAll');

        const statTotal = document.getElementById('statTotal');
        const statActive = document.getElementById('statActive');
        const statExpired = document.getElementById('statExpired');

        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(36).toUpperCase();
        }

        function generatePIN(days) {
            const expMs = Date.now() + (days * 86400000);
            const timeCode = expMs.toString(36).toUpperCase();
            const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
            const checksum = simpleHash(`${timeCode}-${SECRET_SALT}-${rand}`).substring(0, 4);
            return `EXPO-${days}D-${timeCode}-${rand}-${checksum}`;
        }

        function renderTable() {
            licensesTableBody.innerHTML = '';
            let activeCount = 0;
            let expiredCount = 0;
            const now = Date.now();

            if (licenses.length === 0) {
                licensesTableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500 italic">No has generado licencias aún.</td></tr>`;
            } else {
                licenses.forEach((lic, index) => {
                    const isExpired = now > lic.expMs;
                    if (isExpired) expiredCount++; else activeCount++;

                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-800/30 transition";
                    row.innerHTML = `
                        <td class="p-3 font-sans text-slate-200 font-medium">${lic.client || 'Sin nombre'}</td>
                        <td class="p-3 text-indigo-400 font-bold">${lic.pin}</td>
                        <td class="p-3 text-slate-400">${lic.days} días</td>
                        <td class="p-3 text-slate-300">${new Date(lic.expMs).toLocaleDateString('es-PE')}</td>
                        <td class="p-3">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${isExpired ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                                ${isExpired ? 'EXPIRADO' : 'ACTIVO'}
                            </span>
                        </td>
                        <td class="p-3 text-right">
                            <button onclick="copyPin('${lic.pin}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded text-[10px] font-sans transition">📋 Copiar</button>
                        </td>
                    `;
                    licensesTableBody.appendChild(row);
                });
            }

            statTotal.textContent = licenses.length;
            statActive.textContent = activeCount;
            statExpired.textContent = expiredCount;

            localStorage.setItem('admin_sales_records', JSON.stringify(licenses));
        }

        btnGenerate.addEventListener('click', () => {
            const name = clientName.value.trim() || 'Cliente General';
            const days = parseInt(durationDays.value);
            const pin = generatePIN(days);
            const expMs = Date.now() + (days * 86400000);

            licenses.push({
                client: name,
                pin: pin,
                days: days,
                expMs: expMs,
                created: new Date().toLocaleDateString('es-PE')
            });

            clientName.value = '';
            renderTable();
            alert(`¡PIN Creado con éxito para ${name}!\n\nPIN: ${pin}`);
        });

        window.copyPin = function(pin) {
            navigator.clipboard.writeText(pin);
            alert("¡PIN copiado al portapapeles!");
        };

        btnClearAll.addEventListener('click', () => {
            if (confirm("¿Seguro que quieres borrar el registro local?")) {
                licenses = [];
                renderTable();
            }
        });

        renderTable();
    </script>
</body>
</html>
